# Defense in depth for Jekyll-based GitHub Pages previews.
# Prefer the explicit public-only build: npm run build:preview.
exclude:
  - Dexhaven-GBA
  - Dexhaven-Music
  - node_modules
  - server
  - tests
  - database
  - scripts
  - uploads
  - vendor/emulatorjs
  - preview-dist
  - gba-player.html
  - .env
